name: Daily PEA report

on:
  schedule:
    # 17h00 UTC = 19h00 Paris (été, UTC+2) / 18h00 Paris (hiver, UTC+1) — toujours après
    # la clôture Euronext (17h35 Paris). Cron fixe en UTC : à ajuster de ±1h en mars/octobre
    # si l'horaire de réception dérive par rapport à l'heure locale souhaitée.
    - cron: "0 17 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install anthropic

      - name: 1. Récupérer les cours Boursorama
        run: python scripts/fetch_boursorama.py

      - name: 2. Fusionner dans le dataset
        run: python scripts/update_dataset.py

      - name: 3. Recalibrer les poids du modèle (bornée, walk-forward)
        run: python scripts/calibrate_weights.py

      - name: 4. Déterminer la date de séance du jour
        id: date
        run: |
          RUN_DATE=$(python -c "
          import glob
          rows = []
          for p in glob.glob('data/*.csv'):
              with open(p, encoding='utf-8') as f:
                  next(f)
                  for line in f:
                      line = line.strip()
                      if line:
                          rows.append(line.split(';')[0])
          print(max(rows))
          ")
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"

      - name: 5. Générer le score news + narratif (recherche web via l'API Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_narrative.py --date "${{ steps.date.outputs.run_date }}"

      - name: 6. Calculer features + prédictions du jour (avec couche news)
        run: |
          python scripts/compute_features.py \
            --news "predictions/news_${{ steps.date.outputs.run_date }}.json" \
            --out "predictions/quant_${{ steps.date.outputs.run_date }}.json"

      - name: 7. Générer le rapport HTML
        id: report
        run: |
          python scripts/make_report.py --date "${{ steps.date.outputs.run_date }}"
          echo "report_path=rapports/rapport_${{ steps.date.outputs.run_date }}.html" >> "$GITHUB_OUTPUT"

      - name: 8. Committer les données et le rapport mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ config/ predictions/ rapports/
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Rapport du ${{ steps.date.outputs.run_date }}"
            git push
          fi

      - name: 9. Envoyer le rapport par e-mail
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Pipeline PEA <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "Rapport PEA — ${{ steps.date.outputs.run_date }}"
          body: "Rapport du ${{ steps.date.outputs.run_date }} en pièce jointe."
          attachments: ${{ steps.report.outputs.report_path }}
